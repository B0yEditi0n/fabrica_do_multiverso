# Deploy automático da Fábrica do Multiverso
#
# A cada push em "desenvolvimento" ou "main" (ou manualmente, em Actions):
#   1. testes   - flutter analyze + flutter test
#   2. web      - build web publicado no GitHub Pages
#                 https://b0yediti0n.github.io/fabrica_do_multiverso/
#   3. android  - APK de release disponível como artefato da execução
#
# Ao subir uma tag "v*" (ex.: git tag v1.1.0 && git push origin v1.1.0),
# o APK (e o AAB, se houver assinatura) também é anexado a um GitHub Release.
#
# Configuração única no GitHub:
#   - Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   - (Opcional) assinatura Android, em Settings > Secrets and variables > Actions:
#       ANDROID_KEYSTORE_BASE64   keystore .jks em base64
#       ANDROID_KEYSTORE_PASSWORD senha do keystore
#       ANDROID_KEY_ALIAS         alias da chave
#       ANDROID_KEY_PASSWORD      senha da chave
#     Sem esses secrets, o APK é assinado com a chave de debug (instala
#     normalmente, mas não serve para a Play Store).

name: Deploy

on:
  push:
    branches: [desenvolvimento, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # Avisos antigos não bloqueiam o deploy; erros sim
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test --file-reporter json:test-report.json

      # Cada teste que falhar vira uma anotação na execução (nome + erro)
      - name: Detalhar testes que falharam
        if: failure() && hashFiles('test-report.json') != ''
        run: |
          node -e '
            const linhas = require("fs").readFileSync("test-report.json", "utf8").split("\n");
            const nomes = {}, erros = {}, saidas = {};
            for (const l of linhas) {
              if (!l.trim()) continue;
              const e = JSON.parse(l);
              if (e.type === "testStart") nomes[e.test.id] = e.test.name;
              // Exceções de testWidgets saem como "print" antes do erro
              if (e.type === "print") saidas[e.testID] = (saidas[e.testID] || "") + e.message + "\n";
              if (e.type === "error") erros[e.testID] = (erros[e.testID] || "") + e.error + "\n" + (e.stackTrace || "").split("\n").slice(0, 6).join("\n");
            }
            for (const id in erros) {
              const s = (saidas[id] || "").split("\n").filter(x => !/^[═╡╞]+$/.test(x.trim()));
              if (s.length) erros[id] = s.slice(0, 40).join("\n") + "\n" + erros[id];
            }
            const esc = s => s.replace(/%/g, "%25").replace(/\r/g, "").replace(/\n/g, "%0A");
            for (const id in erros) {
              console.log("::error title=" + esc(nomes[id] || "teste " + id).replace(/[:,]/g, " ") + "::" + esc(erros[id].slice(0, 3000)));
            }
          '

  web:
    name: Build web
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # O endereço antigo (.../build/web/index.html) passa a redirecionar
      - name: Redirecionamento do endereço antigo
        run: |
          mkdir -p build/web/build/web
          cat > build/web/build/web/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=../../">
          <link rel="canonical" href="../../">
          <a href="../../">Fábrica do Multiverso</a>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar-web:
    name: Publicar no GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

